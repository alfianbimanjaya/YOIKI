name: YOIKI H1 V2.6 Online Screener

on:
  workflow_dispatch:
  schedule:
    - cron: "25 9 * * 1-5"
      # 09:00-16:55 WIB, Monday-Friday

permissions:
  contents: read

concurrency:
  group: yoiki-h1-v26-live
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-slim
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore runtime state
        uses: actions/cache/restore@v4
        with:
          path: cloud_runtime
          key: yoiki-v26-runtime-${{ github.run_id }}
          restore-keys: |
            yoiki-v26-runtime-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements_online.txt

      - name: Install dependencies
        run: python -m pip install -r requirements_online.txt

      - name: Run YOIKI H1 V2.6
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/08_github_actions_h1_v26_once_simple.py

      - name: Save runtime state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cloud_runtime
          key: yoiki-v26-runtime-${{ github.run_id }}
