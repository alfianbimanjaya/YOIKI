name: YOIKI H1 V2.6 Pending Persistence Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yoiki-h1-v26-pending-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-slim
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore test runtime state
        uses: actions/cache/restore@v4
        with:
          path: cloud_runtime
          key: yoiki-v26-pending-test-${{ github.run_id }}
          restore-keys: |
            yoiki-v26-pending-test-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements_online.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_online.txt

      - name: Run pending persistence test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/99_test_telegram_h1_v26.py

      - name: Show test state
        if: always()
        shell: bash
        run: |
          if [ -f cloud_runtime/telegram_test_state.json ]; then
            echo "===== telegram_test_state.json ====="
            cat cloud_runtime/telegram_test_state.json
          else
            echo "No test state file found."
          fi

      - name: Save test runtime state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cloud_runtime
          key: yoiki-v26-pending-test-${{ github.run_id }}
